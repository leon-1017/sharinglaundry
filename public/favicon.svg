<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- White background -->
  <rect width="64" height="64" rx="12" fill="#ffffff"/>
  
  <!-- Interlocking S curves forming Sharing Laundry logo icon -->
  <!-- Blue curve: starts top-left, curves right and down -->
  <path d="M12 20 C12 12 20 8 32 12 C44 16 52 12 52 24 C52 32 44 36 32 32 C20 28 12 36 12 44 C12 52 20 56 32 52" 
        fill="none" 
        stroke="#1684ff" 
        stroke-width="7" 
        stroke-linecap="round"/>
  
  <!-- Green curve: starts bottom-right, curves left and up (mirrors blue) -->
  <path d="M52 44 C52 52 44 56 32 52 C20 48 12 52 12 40 C12 32 20 28 32 32 C44 36 52 28 52 20 C52 12 44 8 32 12" 
        fill="none" 
        stroke="#61ce70" 
        stroke-width="7" 
        stroke-linecap="round"/>
</svg>